x-environment:
  - &env-postgres-db POSTGRES_DB=${POSTGRES_DB}
  - &env-postgres-user POSTGRES_USER=${POSTGRES_USER}
  - &env-postgres-password POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  - &env-geoserver-user GEOSERVER_ADMIN_USER=${GEOSERVER_ADMIN_USER}
  - &env-geoserver-password GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_ADMIN_PASSWORD}

services:
  postgis:
    build:
      context: ..
      dockerfile: docker/postgis/Dockerfile
    image: 'postgis_prge'
    container_name: 'postgis_prge'
    restart: unless-stopped
    environment:
      - *env-postgres-db
      - *env-postgres-user
      - *env-postgres-password
    ports:
      - 5444:5432
    volumes:
      - postgis-data:/var/lib/postgresql/data

  geoserver:
    build:
      context: ..
      dockerfile: docker/geoserver/Dockerfile
    image: 'geoserver_prge'
    container_name: 'geoserver_prge'
    restart: unless-stopped
    environment:
      - SKIP_DEMO_DATA=true
      - *env-geoserver-user
      - *env-geoserver-password
    ports:
      - 9004:8080
    volumes:
      - ../config/geoserver_data:/opt/geoserver_data

  fastapi:
    build:
      context: ..
      dockerfile: docker/fastapi/Dockerfile
    image: 'fastapi_prge'
    container_name: 'fastapi_prge'
    restart: unless-stopped
    environment:
      - *env-postgres-db
      - *env-postgres-user
      - *env-postgres-password
    ports:
      - 10004:10000
    depends_on:
      - postgis

volumes:
  postgis-data: