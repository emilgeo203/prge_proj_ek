name: deploy
on:
  push:
    branches:
      - env-test
      - env-qa
      - main

jobs:
  build-env-deploy:
    name: build & deploy
    runs-on: self-hosted
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Uruchom srodowisko docker compose
        env:
          ENV_NAME: ${{ github.ref_name }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GEOSERVER_ADMIN_USER: ${{ secrets.GEOSERVER_ADMIN_USER }}
          GEOSERVER_ADMIN_PASSWORD: ${{ secrets.GEOSERVER_ADMIN_PASSWORD }}
          GEOSERVER_PORT: ${{ secrets.GEOSERVER_PORT }}
          FASTAPI_PORT: ${{ secrets.FASTAPI_PORT }}
        run: docker compose -p remote-prge-$ENV_NAME -f docker-compose/docker-compose-remote.yaml up --build -d